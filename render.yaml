services:
  - type: web
    name: school-system-demo
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-system-db
          property: connectionString

databases:
  - name: school-system-db
    plan: starter
